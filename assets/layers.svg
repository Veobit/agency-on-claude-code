<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="898" viewBox="0 0 1280 898" role="img" aria-labelledby="t d">
  <title id="t">Four layers of the agency</title>
  <desc id="d">An owner who approves; an operating layer of sessions, a business spine and gates; a workforce of skills and agents; the marketing layer clients pay for; and a product layer of software the agency owns.</desc>
  <defs><clipPath id="card"><rect width="1280" height="898" rx="24"/></clipPath></defs>
